name: Server Health

on:
  push:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Server Health Report
        run: |
          echo "📊 SERVER HEALTH REPORT"
          echo
          echo "Disk Usage:"
          df -h / | awk 'NR==2 {print $5}'
          echo
          echo "Memory Available:"
          free -h | awk '/Mem:/ {print $7}'
          echo
          echo "CPU Cores:"
          nproc
          echo
          echo "Node Version:"
          node -v
          echo
          echo "Python Version:"
          python3 --version | awk '{print $2}'
          echo
          echo "Health Status:"
          echo "✅ HEALTHY"